# Simple Docker Compose stack — intentionally minimal per project scope
# (no Kubernetes, Redis, Celery, PostGIS, or GeoServer).
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - satquery_pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nextjs
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    ports:
      - "3000:3000"
    volumes:
      - ../storage:/app/storage

  # Optional: the reference Python FastAPI backend, only needed if you want
  # to run the standalone architecture reference with real model weights.
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    profiles: ["reference-backend"]
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/srv/storage
      - ../datasets:/srv/datasets

volumes:
  satquery_pgdata:
